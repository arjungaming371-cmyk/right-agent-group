# Right Agent Group — nginx reverse proxy (VPS deployment path).
# Cloudflare-tunnel deployments don't use this file (see cloudflared-config.example.yml).

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Exotel Voicebot applet — bidirectional WebSocket to the voicebot server.
    # Exotel flow setting: wss://yourdomain.com/voicebot
    location /voicebot {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # calls can be long — don't cut the socket
        proxy_send_timeout 3600s;
    }

    # Everything else — Next.js website
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
# After certbot runs, it adds the HTTPS block automatically
