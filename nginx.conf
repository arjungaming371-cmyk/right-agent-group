# Right Agent Group — nginx reverse proxy (VPS deployment path).
# Cloudflare-tunnel deployments don't use this file (see cloudflared-config.example.yml).

# Rate-limit zones (2026-09 hardening): the OTP login + webhook endpoints are
# the public abuse surface; Next.js rate-limits per-IP in app code, but that
# trusts proxy headers — this caps the firehose before it reaches the app.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # PDF/CSV/lead uploads go through /api/upload and the knowledge-base
    # routes — the nginx default 1MB cap rejected them with a bare 413
    # before the app ever saw the request.
    client_max_body_size 25m;

    # Exotel Voicebot applet — bidirectional WebSocket to the voicebot server.
    # Exotel flow setting: wss://yourdomain.com/voicebot?key=YOUR_SECRET
    # (VOICEBOT_WS_KEY in .env — connections without the key are dropped).
    location /voicebot {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # calls can be long — don't cut the socket
        proxy_send_timeout 3600s;
    }

    # Login/OTP endpoints — brute-force ceiling at the proxy, not just in app.
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — Next.js website
    location / {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Compress text responses (dashboards pull JSON poll responses all day).
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;
}
# After certbot runs, it adds the HTTPS block automatically
